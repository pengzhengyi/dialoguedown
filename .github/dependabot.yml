# Grouping policy
#
# Routine updates arrive as one pull request per ecosystem per week, because a
# batch of patch and minor bumps is reviewed as a unit and rarely needs to be
# picked apart. Major updates stay ungrouped on purpose: they carry the breaking
# changes, and a failure has to be attributable to one package. The jsdom 29 -> 30
# bump is the case in point — it dropped a Node version and took the whole test
# suite down, which would have been far harder to diagnose inside a batch.
#
# Security fixes are grouped separately from version updates: Dependabot never
# folds them into a version-update group, so without `applies-to` they arrive one
# pull request per advisory.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

    # Held back: Verify 33 adopted the Open Source Maintenance Fee and enforces it at
    # build time (SponsorCheck SC021), so the bump stops `dotnet build` before a test
    # runs — a licensing decision, not an engineering one, and this project does not
    # pay a recurring fee for a test-only library. The range matters: `ignore` also
    # governs security-update pull requests, so bounding it below 33 keeps a 32.x
    # security patch flowing and skips only the majors. Lift it when 32.x needs a
    # fix that ships nowhere else.
    ignore:
      - dependency-name: "Verify*"
        versions:
          - ">= 33.0.0"

  - package-ecosystem: "npm"
    directory: "/src/DialogueDown.Visualization/web"
    schedule:
      interval: "weekly"
    groups:
      npm:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

    # Held back: mermaid 12 inlines elkjs, which is EPL-2.0 rather than MIT, so adopting it
    # would put a copy of that licence and a source-availability statement into the shipped
    # package and into every exported report. The range stops the major and nothing else, so a
    # patch on 11.x still arrives. See #492 for the experiment and what would let 12+ through.
    ignore:
      - dependency-name: "mermaid"
        versions:
          - ">= 12.0.0"
