name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Both: the SDK builds every target, but running the net8.0 test targets
          # needs the .NET 8 runtime, and that floor is what keeps Godot working.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DialogueDown.sln

      - name: Verify formatting
        run: dotnet format DialogueDown.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DialogueDown.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DialogueDown.sln --configuration Release --no-build --minimum-expected-tests 3000

      - name: Restore local tools
        run: dotnet tool restore

      - name: Collect coverage
        run: >
          dotnet test DialogueDown.sln
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-include "[DialogueDown*]*"
          --minimum-expected-tests 3000

      - name: Generate coverage report
        run: >
          dotnet reportgenerator
          "-reports:TestResults/coverage.cobertura.*.xml"
          "-targetdir:coverage-report"
          "-reporttypes:Html;MarkdownSummaryGithub;Cobertura;JsonSummary"

      - name: Check coverage thresholds
        run: |
          python3 - <<'PY'
          import json

          # ReportGenerator's own summary, rather than the raw Cobertura: it reports line,
          # branch, and method rates already merged across every target framework.
          summary = json.loads(open("coverage-report/Summary.json").read())["summary"]
          line = float(summary["linecoverage"])
          branch = float(summary["branchcoverage"])
          print(f"Line coverage: {line:.2f}%  Branch coverage: {branch:.2f}%")

          failures = []
          if line < 90:
              failures.append(f"Line coverage {line:.2f}% is below the 90% required floor.")

          # Branch coverage is the stronger signal: a decision point can be fully line-covered
          # with only one of its paths ever taken, so a line-only gate cannot see it.
          if branch < 85:
              failures.append(f"Branch coverage {branch:.2f}% is below the 85% required floor.")

          if failures:
              raise SystemExit("\n".join(failures))

          if line < 100:
              print(
                  f"::warning::Line coverage is {line:.2f}%; "
                  "100% is the aspirational target."
              )
          PY

      - name: Add coverage summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

  frontend_quality:
    name: Frontend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/DialogueDown.Visualization/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/DialogueDown.Visualization/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck, lint, style, format, unit tests)
        run: npm run check

      - name: Build the report
        run: npm run build

      - name: Verify the committed report assets are in sync with web/ sources
        run: git diff --exit-code -- dist/report.html dist/report.js dist/report.css dist/mermaid.js

  frontend_static:
    name: Frontend static E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/DialogueDown.Visualization/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/DialogueDown.Visualization/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: End-to-end tests (Playwright, static)
        run: npm run e2e

  frontend_live:
    name: Frontend live E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/DialogueDown.Visualization/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/DialogueDown.Visualization/web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Both: the SDK builds every target, but running the net8.0 test targets
          # needs the .NET 8 runtime, and that floor is what keeps Godot working.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Prepare live E2E
        shell: bash
        run: |
          set -euo pipefail
          set -m

          npm run build:cli &
          cli_build_pid=$!

          (
            npm ci
            npx playwright install --with-deps --only-shell chromium
          ) &
          provision_pid=$!
          set +m

          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            kill -- "-$cli_build_pid" "-$provision_pid" 2>/dev/null || true
            wait "$cli_build_pid" "$provision_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          wait -n "$cli_build_pid" "$provision_pid" || exit $?
          wait "$cli_build_pid"
          wait "$provision_pid"
          trap - EXIT INT TERM

      - name: End-to-end tests (Playwright, live server)
        run: npx playwright test --config playwright.live.config.ts

  frontend:
    name: Frontend
    if: always()
    needs: [frontend_quality, frontend_static, frontend_live]
    runs-on: ubuntu-latest

    steps:
      - name: Verify every frontend lane passed
        env:
          QUALITY_RESULT: ${{ needs.frontend_quality.result }}
          STATIC_RESULT: ${{ needs.frontend_static.result }}
          LIVE_RESULT: ${{ needs.frontend_live.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$STATIC_RESULT" = "success"
          test "$LIVE_RESULT" = "success"
